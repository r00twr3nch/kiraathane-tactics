<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kapı — Kıraathane Tactics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="landing.css?v=86" />
</head>
<body class="page-play page-door">
  <div class="room" aria-hidden="true">
    <div class="lamp"></div>
    <div class="haze"></div>
  </div>
  <header class="top">
    <a class="brand" href="/index.html">Kıraathane</a>
    <nav class="desk-nav" aria-label="Sayfa">
      <a href="/siralama.html">Sıralama</a>
      <a href="/kurallar.html">Kurallar</a>
      <a href="/oyna.html">Oyna</a>
    </nav>
  </header>
  <main>
    <section class="door" aria-labelledby="door-title">
      <p class="door-mark">Müessese kapısı</p>
      <h1 id="door-title">Adın <em>masaya</em> yazılsın</h1>
      <p class="lede">Kayıtta bir kez kullanıcı adı yazılır. Oyunda görünen tek ad odur.</p>
      <div id="door-session" hidden></div>
      <div id="door-forms">
        <div class="door-tabs" role="tablist" aria-label="Kapı">
          <button type="button" id="tab-in" role="tab" aria-selected="true" aria-controls="form-in">Giriş</button>
          <button type="button" id="tab-up" role="tab" aria-selected="false" aria-controls="form-up">Kayıt</button>
        </div>
        <form id="form-in">
          <label>E-posta
            <input name="email" type="email" autocomplete="username" required maxlength="256" />
          </label>
          <label>Parola
            <input name="password" type="password" autocomplete="current-password" required minlength="8" />
          </label>
          <button class="cta" type="submit">İçeri gir</button>
        </form>
        <form id="form-up" hidden>
          <label>Kullanıcı adı
            <input name="fullName" autocomplete="nickname" placeholder="Örn. Çaycı Nuri" required minlength="2" maxlength="40" />
          </label>
          <label>E-posta
            <input name="email" type="email" autocomplete="email" required maxlength="256" />
          </label>
          <label>Parola
            <input name="password" type="password" autocomplete="new-password" required minlength="8" />
          </label>
          <button class="cta" type="submit">Deftere yazıl</button>
        </form>
        <p class="note" id="door-note" role="status"></p>
      </div>
    </section>
  </main>
  <nav class="dock" aria-label="Masa">
    <a href="/siralama.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20h10M8 16h8l1.2-7H6.8z"/><path d="M9 9c0-2.4 1.2-4 3-4s3 1.6 3 4"/></svg>Sıralama</a>
    <a href="/market.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1 11H6z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>Market</a>
    <a href="/oyna.html" class="dock-play"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2.5"/><path d="M9 9h6M15 16h.01"/></svg>Oyna</a>
    <a href="/kurallar.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h12v14H6z"/><path d="M9 9h6M9 12.5h6M9 16h4"/></svg>Kurallar</a>
  </nav>
  <script src="portraits.js?v=3"></script>
  <script src="landing.js?v=45"></script>
  <script src="kapi.js?v=14"></script>
</body>
</html>
